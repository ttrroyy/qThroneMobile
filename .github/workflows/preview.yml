name: qThroneMobile preview
run-name: qThroneMobile preview
on:
  workflow_dispatch:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    name: APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # BUILD = commits since the latest public release tag, at most 998: previews sort below their release (999).
      - name: Build number
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-pre.*' 2>/dev/null || true)
          if [ -n "$LAST" ]; then COUNT=$(git rev-list --count "$LAST..HEAD"); else COUNT=$(git rev-list --count HEAD); fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::HEAD is the stable tag $LAST: no preview"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD=$(( COUNT > 998 ? 998 : COUNT ))
          echo "Last stable tag: ${LAST:-none}, $COUNT commits since, preview ${VERSION_NAME}-pre.${BUILD}"
          {
            echo "skip=false"
            echo "build=$BUILD"
            echo "tag=v${VERSION_NAME}-pre.${BUILD}"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: preview
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
      - name: Upload artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
