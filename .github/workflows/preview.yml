name: RawlineMobile preview
run-name: RawlineMobile preview
on:
  workflow_dispatch:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    name: APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # BUILD = commits since the latest public release tag, at most 998: previews sort below their release (999).
      - name: Build number
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-pre.*' 2>/dev/null || true)
          if [ -n "$LAST" ]; then COUNT=$(git rev-list --count "$LAST..HEAD"); else COUNT=$(git rev-list --count HEAD); fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::HEAD is the stable tag $LAST: no preview"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD=$(( COUNT > 998 ? 998 : COUNT ))
          echo "Last stable tag: ${LAST:-none}, $COUNT commits since, preview ${VERSION_NAME}-pre.${BUILD}"
          {
            echo "skip=false"
            echo "build=$BUILD"
            echo "tag=v${VERSION_NAME}-pre.${BUILD}"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: preview
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
      - name: Upload artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RawlineMobile-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  update-check:
    name: Update over the last release
    needs: preview
    if: needs.preview.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RawlineMobile-${{ needs.preview.outputs.tag }}
          path: new-apk
      - name: Download the last published beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v3.3.1-beta.3 -R "${{ github.repository }}" -p '*x86_64.apk' -D old-apk
      - name: Install the new build over it
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME" update-check
          ADB="$ANDROID_HOME/platform-tools/adb"
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$SDK/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools' > /dev/null || test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          "$SDK/avdmanager" create avd -n update -k 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/update.avd" --force
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd update -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 "$ADB" wait-for-device
          for attempt in $(seq 1 180); do
            if test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi
            sleep 3
          done
          sleep 30
          PACKAGE=app.qthrone.mobile
          launch() {
            COMPONENT=$("$ADB" shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PACKAGE" | tail -n 1 | tr -d '\r')
            echo "launcher: $COMPONENT"
            "$ADB" shell am start -W -n "$COMPONENT" | tee -a update-check/start-times.txt
            sleep 20
            "$ADB" shell pidof "$PACKAGE"
          }
          "$ADB" install "$(find old-apk -name '*.apk' -print -quit)"
          launch
          "$ADB" logcat -c
          "$ADB" install -r "$(find new-apk -name '*x86_64*.apk' -print -quit)"
          launch
          "$ADB" shell dumpsys package "$PACKAGE" | grep -E 'versionName|versionCode' | tee update-check/version.txt
          "$ADB" exec-out screencap -p > update-check/after-update.png
          "$ADB" shell dumpsys gfxinfo "$PACKAGE" | sed -n '/Total frames/,/Number Slow UI/p' > update-check/frames.txt || true
          "$ADB" logcat -d -b crash > update-check/crashes.txt || true
          ! grep -q "$PACKAGE" update-check/crashes.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RawlineMobile-update-check
          path: update-check/
          if-no-files-found: ignore
