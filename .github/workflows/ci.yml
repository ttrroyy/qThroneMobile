name: qThroneMobile CI
run-name: qThroneMobile CI
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  sstp-tests:
    name: SSTP protocol and SOCKS security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache-dependency-path: carriers/sstp/go.sum
      - name: Test SSTP with the race detector
        working-directory: carriers/sstp
        run: go test -race -count=1 ./...
      - name: Vet SSTP
        working-directory: carriers/sstp
        run: go vet ./...
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release numbering regression
        run: |
          python3 buildScript/test_release_tag.py
          python3 buildScript/test_release_metadata.py
          python3 scripts/test_csqtt_compat_archive.py
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug app:assembleOssDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload regression test APK
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-security-tests
          path: app/build/outputs/apk/androidTest/oss/debug/*.apk
          if-no-files-found: error
