name: Build ThroneCore AAR
description: >-
  Builds app/libs/qThroneCore.aar and generates app/src/main/assets/schema/sing-box.json (with the Android build tags)
  from throneproj/Throne at the THRONE_CORE_REF pinned in nb4a.properties. Both are cached on the resolved commit and
  the core build script.
runs:
  using: composite
  steps:
    - name: Checkout Throne
      shell: bash
      run: |
        set -euo pipefail
        REF=$(sed -n 's/^THRONE_CORE_REF=//p' nb4a.properties | tr -d '\r[:space:]')
        test -n "$REF"
        THRONE_DIR="$(dirname "$GITHUB_WORKSPACE")/Throne"
        rm -rf "$THRONE_DIR"
        git init -q "$THRONE_DIR"
        git -C "$THRONE_DIR" remote add origin https://github.com/ttrroyy/qThrone
        git -C "$THRONE_DIR" fetch -q --depth 1 origin "$REF"
        git -C "$THRONE_DIR" checkout -q --detach FETCH_HEAD
        {
          echo "THRONE_CORE_REF=$REF"
          echo "THRONE_DIR=$THRONE_DIR"
          echo "THRONE_CORE_SHA=$(git -C "$THRONE_DIR" rev-parse HEAD)"
          echo "THRONE_CORE_SCRIPT_SHA=$(sha256sum "$THRONE_DIR/script/build_android.sh" | cut -d' ' -f1)"
        } >> "$GITHUB_ENV"
    - name: Apply mobile core dependency pins
      shell: bash
      run: python3 scripts/prepare_mobile_core.py "$THRONE_DIR/core"
    - name: ThroneCore cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          app/libs/qThroneCore.aar
          app/src/main/assets/schema/sing-box.json
        key: throne-core-${{ env.THRONE_CORE_REF }}-${{ env.THRONE_CORE_SHA }}-${{ env.THRONE_CORE_SCRIPT_SHA }}-${{ hashFiles('.github/actions/throne-core/action.yml', 'core-dependencies.json', 'scripts/prepare_mobile_core.py', 'scripts/patch_mobile_trusttunnel.py', 'scripts/patch_mobile_socks.py', 'scripts/patch_mobile_xray_socks.py', 'core-patches/xray-socks/*.go', 'core-patches/socks/*.go', 'core-patches/trusttunnel/*.go', 'core-patches/mobile/*.go', 'scripts/patch_mobile_warp.py', 'core-patches/warp/*.go', 'scripts/patch_mobile_obfs.py', 'core-patches/obfs/*.go') }}
    - name: Install Golang
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: false
    - name: Go module cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-throne-${{ runner.os }}-${{ env.THRONE_CORE_SHA }}
        restore-keys: |
          go-mod-throne-${{ runner.os }}-
    - name: Apply mobile TrustTunnel fallback
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 scripts/patch_mobile_trusttunnel.py "$THRONE_DIR/core"
    - name: Bind authenticated local SOCKS UDP sessions to their client ports
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python3 scripts/patch_mobile_socks.py "$THRONE_DIR/core"
        python3 scripts/patch_mobile_xray_socks.py "$THRONE_DIR/core"
    - name: WireGuard obfuscators and Phobos SOCKS5
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 scripts/patch_mobile_obfs.py "$THRONE_DIR/core"
    - name: WARP registration through the active tunnel
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 scripts/patch_mobile_warp.py "$THRONE_DIR/core"
    - name: Setup Java
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Install gomobile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
        go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Build ThroneCore AAR
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}
      run: |
        sed -i -e 's/ThroneCore.aar/qThroneCore.aar/g' -e 's/-javapkg=io.throneproj/-javapkg=app.qthrone.core/g' -e 's/-libname=throne/-libname=qthrone/g' script/build_android.sh
        DEST="$GITHUB_WORKSPACE/app/libs" bash script/build_android.sh
    - name: TrustTunnel connection regression
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: CGO_ENABLED=0 go test -tags with_quic,with_utls,with_purego github.com/xchacha20-poly1305/sing-trusttunnel ./mobile ./internal/warp -count=1
    - name: Local SOCKS UDP source isolation regression
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: CGO_ENABLED=0 go test github.com/sagernet/sing/protocol/socks github.com/xtls/xray-core/proxy/socks -count=1
    - name: Obfuscator wire compatibility
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: CGO_ENABLED=0 go test ./internal/obfs -count=1
    # Same registries as the AAR: the Android TAGS of script/build_android.sh (cf. script/gen_schema.sh). with_purego and
    # CGO_ENABLED=0 only keep cronet-go from linking its static library; option registration does not depend on them.
    - name: Generate sing-box schema
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: |
        set -euo pipefail
        TAGS=$(sed -n 's/^TAGS="\(.*\)"$/\1/p' ../script/build_android.sh)
        test -n "$TAGS"
        OUT="$GITHUB_WORKSPACE/app/src/main/assets/schema/sing-box.json"
        mkdir -p "$(dirname "$OUT")"
        CGO_ENABLED=0 go run -trimpath -ldflags=-checklinkname=0 -tags "$TAGS,with_purego" ./cmd/schemagen -o "$OUT"
    - name: Verify ThroneCore AAR and schema
      shell: bash
      run: |
        set -euo pipefail
        test -s app/libs/qThroneCore.aar
        unzip -l app/libs/qThroneCore.aar > "$RUNNER_TEMP/throne-core-aar.txt"
        unzip -p app/libs/qThroneCore.aar classes.jar > "$RUNNER_TEMP/throne-core-classes.jar"
        unzip -l "$RUNNER_TEMP/throne-core-classes.jar" > "$RUNNER_TEMP/throne-core-classes.txt"
        grep -q 'app/qthrone/core/mobile/Mobile.class' "$RUNNER_TEMP/throne-core-classes.txt"
        grep -q 'go/Seq.class' "$RUNNER_TEMP/throne-core-classes.txt"
        # the APK splits (buildSrc Helpers.kt) must match the core targets
        for abi in arm64-v8a armeabi-v7a x86_64; do
          grep -q "jni/$abi/libqthrone.so" "$RUNNER_TEMP/throne-core-aar.txt" \
            || { echo "::error::qThroneCore.aar has no jni/$abi/libqthrone.so"; exit 1; }
        done
        python3 -c 'import json, sys; json.load(open(sys.argv[1]))' app/src/main/assets/schema/sing-box.json
    - name: Save verified qThrone core
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          app/libs/qThroneCore.aar
          app/src/main/assets/schema/sing-box.json
        key: throne-core-${{ env.THRONE_CORE_REF }}-${{ env.THRONE_CORE_SHA }}-${{ env.THRONE_CORE_SCRIPT_SHA }}-${{ hashFiles('.github/actions/throne-core/action.yml', 'core-dependencies.json', 'scripts/prepare_mobile_core.py', 'scripts/patch_mobile_trusttunnel.py', 'scripts/patch_mobile_socks.py', 'scripts/patch_mobile_xray_socks.py', 'core-patches/xray-socks/*.go', 'core-patches/socks/*.go', 'core-patches/trusttunnel/*.go', 'core-patches/mobile/*.go', 'scripts/patch_mobile_warp.py', 'core-patches/warp/*.go', 'scripts/patch_mobile_obfs.py', 'core-patches/obfs/*.go') }}
